name: Feed the snake

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snake:
    name: Refresh contribution animation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#537d13&color_dots=#edf1e7,#d8edb4,#addb6a,#7cb832,#537d13
            assets/snake-dark.svg?palette=github-dark&color_snake=#c4f564&color_dots=#1c2417,#344a20,#597d2c,#87b841,#c4f564

      - name: Save refreshed animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            echo "The snake is already up to date."
            exit 0
          fi
          git commit -m "Refresh contribution snake [skip ci]"
          git push origin HEAD:main
