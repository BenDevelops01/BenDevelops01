name: Feed the snake

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/trim-snake.py

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snake:
    name: Refresh contribution animation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#496bd4&color_dots=#ebedf0,#d4dff6,#a6bbed,#7392df,#496bd4
            assets/snake-dark.svg?palette=github-dark&color_snake=#e2e8f0&color_dots=#161b22,#263657,#3b5281,#6889c9,#9bbbff

      - name: Remove the bottom contribution bar
        run: python3 .github/scripts/trim-snake.py assets/snake-light.svg assets/snake-dark.svg

      - name: Save refreshed animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/snake-light.svg assets/snake-dark.svg
          if git diff --cached --quiet; then
            echo "The snake is already up to date."
            exit 0
          fi
          git commit -m "Refresh contribution snake [skip ci]"
          git push origin HEAD:main

