name: Contribution activity

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
      - .github/scripts/render-activity.py

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snake:
    name: Refresh contribution activity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Render the contribution grid and snake
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/render-activity.py --user "$PROFILE_USER" --out assets

      - name: Save refreshed activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/activity-dark.svg assets/activity-light.svg assets/activity-dark-mobile.svg assets/activity-light-mobile.svg assets/activity-data.json
          if git diff --cached --quiet; then
            echo "Contribution activity is already up to date."
            exit 0
          fi
          git commit -m "Refresh contribution activity [skip ci]"
          git push origin HEAD:main

